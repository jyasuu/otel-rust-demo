global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "otel-rust-demo"
    static_configs:
      - targets: ["app:8080"]
    metrics_path: /metrics

  - job_name: "billing-service"
    static_configs:
      - targets: ["billing-service:8081"]
    metrics_path: /metrics

  - job_name: "payment-gateway"
    static_configs:
      - targets: ["payment-gateway:8082"]
    metrics_path: /metrics
