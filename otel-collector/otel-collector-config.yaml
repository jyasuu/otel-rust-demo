extensions:
  pprof:
    endpoint: 0.0.0.0:1777

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Drop spans from Prometheus scraping the services' /metrics endpoints, so
  # those trivial one-span traces don't clutter Jaeger.
  filter/drop-scrapes:
    error_mode: ignore
    traces:
      span:
        - 'attributes["route"] == "/metrics"'
  # Prune noisy internal tracing fields (frame/debug info) from every span
  # before export, keeping the traces easier to read.
  attributes/prune:
    actions:
      - key: busy_ns
        action: delete
      - key: idle_ns
        action: delete
      - key: code.file.path
        action: delete
      - key: code.line.number
        action: delete
      - key: code.module.name
        action: delete
      - key: thread.id
        action: delete
      - key: thread.name
        action: delete
  # Tail sampling: decide on whole traces (not span-by-span), so a failure
  # anywhere in the app -> billing -> gateway chain keeps the ENTIRE trace.
  # We always keep traces containing an ERROR-status span, and probabilistically
  # drop ~half of the healthy ones. Compare with `probabilistic_sampler_processor`
  # (a deterministic head-sampler that would just cut a random % of spans).
  tail_sampling:
    decision_wait: 5s
    num_traces: 100000
    expected_new_traces_per_sec: 20
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: sampled
        type: probabilistic
        probabilistic:
          sampling_percentage: 50

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic
  # Verbose output for the logs pipeline so we can see each log record's
  # TraceID/SpanID (and correlate them with the matching trace in Jaeger).
  debug/logs:
    verbosity: detailed

service:
  # Enable the collector's own diagnostics: a pprof endpoint and OTel SDK
  # telemetry (own log level + own metrics on :8888 for Prometheus scraping).
  extensions: [pprof]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/drop-scrapes, attributes/prune, batch, tail_sampling]
      exporters: [otlp/jaeger, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/logs]