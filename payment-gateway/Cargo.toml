[package]
name = "payment-gateway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "payment-gateway"
path = "src/main.rs"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Structured logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.32"

# OpenTelemetry core + SDK
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "logs"] }

# Traces + logs -> OTLP/gRPC -> OTel Collector -> Jaeger
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "logs"] }

# Metrics -> exposed as /metrics -> scraped by Prometheus
opentelemetry-prometheus = "0.32"
prometheus = "0.14"

# W3C trace context extraction from incoming headers
opentelemetry-http = "0.32"

anyhow = "1"