[package]
name = "billing-proto"
version = "0.1.0"
edition = "2021"

[dependencies]
# Versions match what tonic 0.14 expects (also pinned by opentelemetry-otlp 0.32).
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

[build-dependencies]
# tonic-build 0.14 moved the classic `configure()` API out to tonic-prost-build
tonic-prost-build = "0.14"